services:
  backend1:
    image: node:18-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./backend/server.js:/app/server.js
      - ./backend/package.json:/app/package.json
    environment:
      - PORT=3000
      - NODE_ENV=production
    command: sh -c "npm install && npm start"
    restart: unless-stopped
    networks:
      - lb-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend2:
    image: node:18-alpine
    working_dir: /app
    ports:
      - "3001:3001"
    volumes:
      - ./backend/server.js:/app/server.js
      - ./backend/package.json:/app/package.json
    environment:
      - PORT=3001
      - NODE_ENV=production
    command: sh -c "npm install && npm start"
    restart: unless-stopped
    networks:
      - lb-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend3:
    image: node:18-alpine
    working_dir: /app
    ports:
      - "3002:3002"
    volumes:
      - ./backend/server.js:/app/server.js
      - ./backend/package.json:/app/package.json
    environment:
      - PORT=3002
      - NODE_ENV=production
    command: sh -c "npm install && npm start"
    restart: unless-stopped
    networks:
      - lb-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3002/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    restart: unless-stopped
    networks:
      - lb-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx_health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  haproxy:
    image: haproxy:alpine
    ports:
      - "9000:9000"
      - "9001:9001"
      - "9002:9002"
      - "9003:9003"
      - "9004:9004"
      - "9999:9999"
    volumes:
      - ./haproxy/haproxy-advanced.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    restart: unless-stopped
    networks:
      - lb-network
    command: haproxy -f /usr/local/etc/haproxy/haproxy.cfg

networks:
  lb-network:
    driver: bridge
