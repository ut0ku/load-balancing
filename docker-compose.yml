services:
  backend1:
    build: ./backend
    environment:
      - PORT=8080
      - SERVER_ID=backend-1
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - lb-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend2:
    build: ./backend
    environment:
      - PORT=8080
      - SERVER_ID=backend-2
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - lb-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend3:
    build: ./backend
    environment:
      - PORT=8080
      - SERVER_ID=backend-3
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - lb-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    restart: unless-stopped
    networks:
      - lb-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  haproxy:
    image: haproxy:alpine
    ports:
      - "81:80"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: unless-stopped
    networks:
      - lb-network
    command: haproxy -f /usr/local/etc/haproxy/haproxy.cfg

networks:
  lb-network:
    driver: bridge
