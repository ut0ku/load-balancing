user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Round Robin (по умолчанию)
    upstream backend_roundrobin {
        server backend1:3000;
        server backend2:3001;
        server backend3:3002 backup;
    }

    # Least Connections
    upstream backend_leastconn {
        least_conn;
        server backend1:3000 max_fails=2 fail_timeout=30s;
        server backend2:3001 max_fails=2 fail_timeout=30s;
        server backend3:3002 backup;
    }

    # IP Hash
    upstream backend_iphash {
        hash $remote_addr consistent;
        server backend1:3000;
        server backend2:3001;
        server backend3:3002;
    }



    # Default server (Round Robin)
    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://backend_roundrobin;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Upstream-Status $upstream_status always;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location = /nginx_health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location /health {
            proxy_pass http://backend_roundrobin/health;
            proxy_http_version 1.1;
            access_log off;
        }

        location /status {
            stub_status on;
            access_log off;
        }
    }

    # Least Connections
    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://backend_leastconn;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Upstream-Status $upstream_status always;
        }
    }

    # IP Hash
    server {
        listen 8081;
        server_name localhost;

        location / {
            proxy_pass http://backend_iphash;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Upstream-Status $upstream_status always;
        }
    }


}
