user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    upstream backend_roundrobin {
        server backend1:8080 max_fails=2 fail_timeout=30s;
        server backend2:8080 max_fails=2 fail_timeout=30s;
        server backend3:8080 backup max_fails=2 fail_timeout=30s;
    }
    server {
        listen 8080;
        server_name localhost;

        client_max_body_size 20M;

        location / {
            proxy_pass http://backend_roundrobin;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /health {
            proxy_pass http://backend_roundrobin/health;
            proxy_http_version 1.1;
            access_log off;
        }

        location /status {
            stub_status on;
            access_log off;
            allow all;
        }
    }
}
