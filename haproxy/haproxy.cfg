global
    log stdout local0
    log stdout local1 notice
    stats timeout 30s
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  redispatch
    retries 3
    timeout connect 2000ms
    timeout client  30000ms
    timeout server  30000ms

# Round Robin
frontend frontend_roundrobin
    bind *:80
    default_backend backend_roundrobin

backend backend_roundrobin
    balance roundrobin
    server server1 backend1:8080 check inter 1s rise 2 fall 2
    server server2 backend2:8080 check inter 1s rise 2 fall 2
    server server3 backend3:8080 backup check inter 1s rise 2 fall 2

