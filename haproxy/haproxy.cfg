global
    log stdout local0
    log stdout local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

# Round Robin (Default)
frontend frontend_roundrobin
    bind *:8000
    default_backend backend_roundrobin

backend backend_roundrobin
    balance roundrobin
    server server1 127.0.0.1:3000 check inter 2s rise 2 fall 3
    server server2 127.0.0.1:3001 check inter 2s rise 2 fall 3
    server server3 127.0.0.1:3002 backup check inter 2s

# Least Connections
frontend frontend_leastconn
    bind *:8001
    default_backend backend_leastconn

backend backend_leastconn
    balance leastconn
    server server1 127.0.0.1:3000 check inter 2s rise 2 fall 3
    server server2 127.0.0.1:3001 check inter 2s rise 2 fall 3
    server server3 127.0.0.1:3002 backup check inter 2s

# Source IP Hash
frontend frontend_iphash
    bind *:8002
    default_backend backend_iphash

backend backend_iphash
    balance source
    server server1 127.0.0.1:3000 check inter 2s rise 2 fall 3
    server server2 127.0.0.1:3001 check inter 2s rise 2 fall 3
    server server3 127.0.0.1:3002 backup check inter 2s


