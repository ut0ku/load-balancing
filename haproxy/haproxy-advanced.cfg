global
    log stdout local0
    log stdout local1 notice
    user haproxy
    group haproxy
    daemon
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    option  forwardfor except 127.0.0.0/8
    option  redispatch
    retries 3
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    timeout queue   50000ms

# ===== ROUND ROBIN =====
frontend http_roundrobin
    bind *:9000
    default_backend backend_roundrobin

backend backend_roundrobin
    balance roundrobin
    server server1 backend1:3000 check
    server server2 backend2:3001 check
    server server3 backend3:3002 backup check

# ===== LEAST CONNECTIONS =====
frontend http_leastconn
    bind *:9001
    default_backend backend_leastconn

backend backend_leastconn
    balance leastconn
    server server1 backend1:3000 check
    server server2 backend2:3001 check
    server server3 backend3:3002 backup check

# ===== IP HASH =====
frontend http_iphash
    bind *:9002
    default_backend backend_iphash

backend backend_iphash
    balance source
    server server1 backend1:3000 check
    server server2 backend2:3001 check
    server server3 backend3:3002 backup check


